name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build APK without Gradle daemon
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2048m\ -Dfile.encoding=UTF-8
        run: |
          gradle --stop || true
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndreasHadji-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
